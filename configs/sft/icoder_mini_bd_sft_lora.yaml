model:
  config_path: ./configs/model_configs/llada2_mini
  model_path: ../models/merged_model/LLaDA2.1-mini/
  tokenizer_path: ./tokenizers/icoder
  attn_implementation: sdpa
  moe_implementation: fused
  # LoRA settings
  lora_rank: 16
  lora_alpha: 32
  lora_target_modules: query_key_value,dense,gate_proj,up_proj,down_proj
  init_lora_weights: kaiming

data:
  train_path: ../data/transformed_202603
  train_config_name: EpiCoder
  data_type: conversation
  datasets_type: hf
  dataloader_type: native
  max_seq_len: 2048
  text_keys: messages
  noise_range_low: 0.3
  noise_range_high: 0.8
  num_workers: 8

train:
  train_architecture: lora
  output_dir: ./llada2_mini_bd_sft_lora_outputs
  data_parallel_mode: fsdp2
  tensor_parallel_size: 1
  ulysses_parallel_size: 1
  expert_parallel_size: 1
  global_batch_size: 2
  micro_batch_size: 1
  num_train_epochs: 1
  rmpad: false
  rmpad_with_pos_ids: false
  bsz_warmup_ratio: 0.007
  dyn_bsz_margin: 0
  dyn_bsz_buffer_size: 200
  optimizer: adamw
  beta1: 0.9
  beta2: 0.999
  lr: 1.0e-4
  lr_warmup_ratio: 0.03
  lr_decay_style: cosine
  lr_decay_ratio: 1.0
  weight_decay: 0.0
  max_grad_norm: 1.0
  enable_mixed_precision: true
  enable_gradient_checkpointing: true
  enable_full_shard: true
  enable_fsdp_offload: false
  enable_activation_offload: false
  init_device: meta
  broadcast_model_weights_from_rank0: true
  enable_full_determinism: false
  empty_cache_steps: 500
  ckpt_manager: dcp
  load_checkpoint_path: ""
  save_epochs: 1
  save_steps: 2000
  save_hf_weights: true
  block_diffusion_mode: true
  block_size: 32
  same_token_labels: true
  use_wandb: true
  wandb_project: iCoder-LLaDA
  wandb_name: icoder-LLaDA2.1-mini-LoRA-SFT-20260326
  data_monitor_steps: 1
  data_monitor_max_tokens: 512
  data_monitor_random_sample: true
  log_steps: 10
