model:
  config_path: ./configs/model_configs/llada2_mini
  model_path: ./LLaDA2.0-mini-preview-moe-merge
  tokenizer_path: ./tokenizers/latent
  attn_implementation: sdpa
  moe_implementation: fused

data:
  train_path: ./gsm8k_datasets/gsm8k_train.jsonl
  data_type: conversation
  datasets_type: mapping
  dataloader_type: native
  max_seq_len: 2048
  text_keys: messages
  noise_range_low: 0.3
  noise_range_high: 0.8
  num_workers: 16

train:
  output_dir: ./llada2_mini_bd_latent_sft_outputs
  data_parallel_mode: fsdp2
  tensor_parallel_size: 1
  ulysses_parallel_size: 1
  expert_parallel_size: 1
  global_batch_size: 8
  micro_batch_size: 1
  num_train_epochs: 1
  rmpad: false
  rmpad_with_pos_ids: false
  bsz_warmup_ratio: 0.007
  dyn_bsz_margin: 0
  dyn_bsz_buffer_size: 200
  optimizer: adamw
  beta1: 0.9
  beta2: 0.999
  lr: 1.0e-5
  lr_warmup_ratio: 0.03
  lr_decay_style: cosine
  lr_decay_ratio: 1.0
  weight_decay: 0.1
  max_grad_norm: 1.0
  enable_mixed_precision: true
  enable_gradient_checkpointing: true
  enable_full_shard: true
  enable_fsdp_offload: true
  enable_activation_offload: false
  init_device: meta
  broadcast_model_weights_from_rank0: true
  enable_full_determinism: false
  empty_cache_steps: 500
  ckpt_manager: dcp
  load_checkpoint_path: ""
  save_epochs: 1
  save_hf_weights: true
  block_diffusion_mode: true
  block_size: 32
  same_token_labels: true
  latent_loss_weight: 1.0
  token_loss_weight: 1.0
  latent_dim: 768
  latent_head_lr: 1.0e-4
  sentence_model_name: all-mpnet-base-v2
  latent_diffusion_obj1: false
  latent_noise_range_low: 0.3
  latent_noise_range_high: 1.0
  use_wandb: false
  log_steps: 1
